  id: binary_orthogonal
  name: Binary Orthogonal
  ref_domain: geometry
  visual: quadrant
  visual_prompt: | 
    ...existing code...
  description: A quadrant model using two conceptual axes (X and Y) to form four composite quadrant entities.
  inherits: base_model
  entities:
    ...existing code...
  relations:
    ...existing code...
  interaction_patterns:
    - type: 结构围合
      description: 两条正交轴（axis_x, axis_y）将空间划分为四个象限（quadrant_I~IV），每个象限由两条轴的正负向量组合围合。
    - type: 维度与分类
      description: 通过X轴和Y轴对分析对象进行双维度分类定位。
    - type: 运算与变换
      description: 四个象限之间通过对称变换关系（x_flip, y_flip, diagonal_reverse, diagonal_swap）建立映射。

