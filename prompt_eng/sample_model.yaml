# ==========================================
#   Impossible Triangle of Family Life (G2_TrinaryTriangle Structure)
#
#                sex
#                 ▲
#                / \
#               /   \
#              /     \
#             /       \
#            /         \
#      love_life —— career
#
# Diagram:
# - Each vertex represents one of the three core aspects of family life:
#     sex: Sexual satisfaction and intimacy
#     love_life: Romantic relationship and emotional connection
#     career: Career success and financial stability
# - Each edge represents the trade-off and mutual influence between two aspects.
# - The trilemma: only two of the three can be fully achieved at the same time.
# ==========================================
model:
  id: impossible_triangle_family_life
  name: Impossible Triangle (Family Life)
  ref_domain: family_life
  visual: triangle
  description: >
    The Impossible Triangle in family life: one cannot fully achieve sexual satisfaction, romantic love, and career/financial success at the same time. Only two of the three can be fully realized simultaneously. Each aspect influences the others, often in a negative way when one is prioritized.
  inherits: trinary_triangle

  entities:
    - id: sex
      prototype: node
      define_baseset: [primitive]
      define_prompt: Sexual satisfaction and intimacy
      occur: 1
    - id: love_life
      prototype: node
      define_baseset: [primitive]
      define_prompt: Romantic relationship and emotional connection
      occur: 1
    - id: career
      prototype: node
      define_baseset: [primitive]
      define_prompt: Career success and financial stability
      occur: 1

  relations:
    - id: edge_sex_love_life
      prototype: edge
      define_baseset: [sex, love_life]
      define_prompt: >
        Mutual influence between sex and romantic love. 
        For example, lack of emotional connection can reduce sexual satisfaction, and vice versa.
      occur: 1
    - id: edge_love_life_career
      prototype: edge
      define_baseset: [love_life, career]
      define_prompt: >
        Trade-off and influence between romantic love and career. 
        More focus on career may reduce time and energy for love life, while relationship issues can affect work performance.
      occur: 1
    - id: edge_career_sex
      prototype: edge
      define_baseset: [career, sex]
      define_prompt: >
        Trade-off and influence between career and sex. 
        High work pressure or long hours may reduce desire or time for sex; lack of sexual satisfaction may affect work mood and motivation.
      occur: 1


---
# ==========================================
#   Dynamic Chemical Reaction Model (G3_BinaryOpposition Structure)
#
#      (Reactant excess)                      (Product excess)
#            ↑                                    ↑
#         reactant    ←——  equilibrium  ——→  product
#            ↓                                    ↓
#      (to equilibrium)                     (to equilibrium)
#
# Explanation:
# - reactant: The chemical reactant(s) in the system.
# - product: The chemical product(s) in the system.
# - equilibrium: The dynamic equilibrium point between reactant and product.
# - flow_reactant_to_product: Net reaction proceeds from reactant to product when reactant is in excess.
# - flow_product_to_reactant: Net reaction proceeds from product to reactant when product is in excess (reverse reaction).
# - to_equilibrium_reactant: Reactant moves toward equilibrium (rate depends on excess reactant).
# - to_equilibrium_product: Product moves toward equilibrium (rate depends on excess product).
# ==========================================
model:
  id: dynamic_chemical_reaction
  name: Dynamic Chemical Reaction (G3 Structure)
  ref_domain: chemistry
  visual: line_with_center
  description: >
    A dynamic model of a reversible chemical reaction, showing the flow between reactant and product and the establishment of equilibrium. Inherits the binary opposition with equilibrium structure.
  inherits: binary_opposition

  entities:
    - id: reactant
      prototype: node
      define_baseset: [primitive]
      define_prompt: The chemical reactant(s) in the reaction.
      occur: 1
    - id: product
      prototype: node
      define_baseset: [primitive]
      define_prompt: The chemical product(s) in the reaction.
      occur: 1
    - id: equilibrium
      prototype: equilibrium
      define_baseset: [reactant, product]
      define_prompt: The dynamic equilibrium point between reactant and product.
      occur: 1

  relations:
    - id: flow_reactant_to_product
      prototype: relation
      define_baseset: [reactant, product]
      define_prompt: Net flow from reactant to product when reactant is in excess (forward reaction).
      occur: 1
    - id: flow_product_to_reactant
      prototype: relation
      define_baseset: [product, reactant]
      define_prompt: Net flow from product to reactant when product is in excess (reverse reaction).
      occur: 1
    - id: to_equilibrium_reactant
      prototype: relation
      define_baseset: [reactant, equilibrium]
      define_prompt: Reactant moves toward equilibrium; rate depends on reactant excess.
      occur: 1
    - id: to_equilibrium_product
      prototype: relation
      define_baseset: [product, equilibrium]
      define_prompt: Product moves toward equilibrium; rate depends on product excess.
      occur: 1


# ==========================================
#   Market Price Formation Model (G3_NegativeFeedbackOpposition Structure)
#
#      (Excess Supply)                        (Excess Demand)
#            ↑                                    ↑
#         supply        ←——  equilibrium  ——→  demand
#            ↓                                    ↓
#      (adjust to equilibrium)             (adjust to equilibrium)
#
# Explanation:
# - supply: The total supply of a good in the market.
# - demand: The total demand for a good in the market.
# - equilibrium: The market equilibrium price/quantity where supply equals demand.
# - negative_feedback_supply_to_demand: When supply exceeds demand, price tends to fall, stimulating demand and reducing supply.
# - negative_feedback_demand_to_supply: When demand exceeds supply, price tends to rise, stimulating supply and reducing demand.
# - to_equilibrium_supply: Supply adjusts toward equilibrium.
# - to_equilibrium_demand: Demand adjusts toward equilibrium.
# ==========================================
model:
  id: market_price_formation
  name: Market Price Formation Model
  ref_domain: economics
  visual: line_with_center
  description: >
    A binary opposition model for market price formation, where supply and demand interact via negative feedback, driving the system toward market equilibrium.
  inherits: negative_feedback_opposition

  entities:
    - id: supply
      prototype: node
      define_baseset: [primitive]
      define_prompt: The total supply of a good in the market.
      occur: 1
    - id: demand
      prototype: node
      define_baseset: [primitive]
      define_prompt: The total demand for a good in the market.
      occur: 1
    - id: equilibrium
      prototype: equilibrium
      define_baseset: [supply, demand]
      define_prompt: The market equilibrium point where supply equals demand.
      occur: 1

  relations:
    - id: negative_feedback_supply_to_demand
      prototype: feedback
      define_baseset: [supply, demand]
      define_prompt: Negative feedback from supply to demand (excess supply lowers price, increases demand, reduces supply).
      occur: 1
    - id: negative_feedback_demand_to_supply
      prototype: feedback
      define_baseset: [demand, supply]
      define_prompt: Negative feedback from demand to supply (excess demand raises price, increases supply, reduces demand).
      occur: 1
    - id: to_equilibrium_supply
      prototype: relation
      define_baseset: [supply, equilibrium]
      define_prompt: Supply adjusts toward equilibrium.
      occur: 1
    - id: to_equilibrium_demand
      prototype: relation
      define_baseset: [demand, equilibrium]
      define_prompt: Demand adjusts toward equilibrium.
      occur: 1

---
# ==========================================
#   Science vs Religion Model (G4_Closure Structure)
#
#   +-----------------------------------------+
#   |              science_set                |
#   |            ● science_entity             |
#   |                                         |
#   |    ↑                          |         |
#   +----|--------------------------|---------+
#        |                          |
# religion_to_science         science_to_religion
#        |                          |
#        |         religion_set      |
#        |    ○ religion_entity      ↓
#
# Diagram:
# - The box represents the science_set, containing science_entity (e.g., scientific knowledge, methods, practitioners).
# - Outside the box is the religion_set, containing religion_entity (e.g., religious beliefs, practices, communities).
# - religion_to_science: Influence from religion to science (e.g., religious values shaping scientific ethics).
# - science_to_religion: Feedback or influence from science to religion (e.g., scientific discoveries impacting religious interpretations).
# ==========================================
model:
  id: science_vs_religion
  name: Science vs Religion (Closure Structure)
  ref_domain: philosophy
  visual: set
  description: >
    A closure model describing the interaction between science (internal set) and religion (external set), and their mutual influences.
  inherits: closure

  entities:
    - id: science_set
      prototype: set
      define_baseset: [primitive]
      define_prompt: The set representing science, including scientific knowledge, methods, and practitioners.
      occur: 1
    - id: religion_set
      prototype: set
      define_baseset: [science_set]
      define_prompt: The set representing religion, including beliefs, practices, and communities, defined relative to science.
      occur: 1
    - id: science_entity
      prototype: element
      define_baseset: [science_set]
      define_prompt: An entity from the science set (e.g., a scientific theory, scientist, or method).
      occur: n+
    - id: religion_entity
      prototype: element
      define_baseset: [religion_set]
      define_prompt: An entity from the religion set (e.g., a religious doctrine, ritual, or leader).
      occur: n+

  relations:
    - id: religion_to_science
      prototype: relation
      define_baseset: [religion_entity, science_entity]
      define_prompt: Influence from religion to science, such as religious values shaping scientific ethics or research priorities.
      occur: n*
    - id: science_to_religion
      prototype: relation
      define_baseset: [science_entity, religion_entity]
      define_prompt: Feedback or influence from science to religion, such as scientific discoveries impacting religious interpretations or practices.
      occur: n*


---
# ==========================================
#   National Power Matrix Model (G5_HybridMatrix Structure)
#
#   geo   econ   military   religion   ideology  ←-- col_define_set
# +------+------+---------+----------+----------+
# |      |      |         |          |          |  country_1
# +------+------+---------+----------+----------+
# |      |      |         |          |          |  country_2
# +------+------+---------+----------+----------+
# |      |      |         |          |          |  country_3
# +------+------+---------+----------+----------+
#  ...   ...    ...       ...        ...        (row_define_set)
#
# Diagram:
# - Each row represents a country.
# - Each column represents a dimension: geopolitics, economy, military, religion, ideology.
# - Each cell describes the intersection of a country and a dimension (e.g., China's economic power, US military power).
# ==========================================
model:
  id: national_power_matrix
  name: National Power Matrix
  ref_domain: geopolitics
  visual: grid
  description: >
    A hybrid matrix model for analyzing countries across five dimensions: geopolitics, economy, military, religion, and ideology. Each cell represents a country's status or influence in a specific dimension.
  inherits: hybrid_matrix

  entities:
    - id: country_set
      prototype: set
      define_baseset: [primitive]
      define_prompt: The set of all countries under analysis.
      occur: 1
    - id: dimension_set
      prototype: set
      define_baseset: [primitive]
      define_prompt: The set of all dimensions: geopolitics, economy, military, religion, ideology.
      occur: 1
    - id: country
      prototype: dimension
      define_baseset: [country_set]
      define_prompt: A country entity (e.g., China, US, Russia).
      occur: n+
    - id: dimension
      prototype: dimension
      define_baseset: [dimension_set]
      define_prompt: A dimension entity (geo, econ, military, religion, ideology).
      occur: 5
    - id: cell_entity
      prototype: cell
      define_baseset: [country, dimension]
      define_prompt: The intersection of a country and a dimension, describing the country's status or influence in that dimension.
      occur: n+

  relations:
    - id: matrix_cross
      prototype: relation
      define_baseset: [country, dimension]
      define_prompt: The relationship or value at the intersection of a country and a dimension (e.g., military strength, economic size, religious influence, ideological stance).
      occur: 1

---
# ==========================================
#   Team Situation Symmetric Comparison Model (G6_SymmetricMatrix Structure)
#
#         team_1   team_2   team_3   ...   team_n   ←-- define_set (columns)
#       +--------+--------+--------+-----+--------+
# team_1|        |        |        |     |        |
#       +--------+--------+--------+-----+--------+
# team_2|        |        |        |     |        |
#       +--------+--------+--------+-----+--------+
# team_3|        |        |        |     |        |
#       +--------+--------+--------+-----+--------+
#  ...    ...      ...      ...     ...    ...    (rows)
#
# Diagram:
# - Both rows and columns are teams from the same set.
# - Each cell describes the symmetric comparison or relationship between two teams (e.g., head-to-head record, relative strength, tactical matchup).
# ==========================================
model:
  id: team_symmetric_comparison_matrix
  name: Team Symmetric Comparison Matrix
  ref_domain: sports
  visual: grid
  description: >
    A symmetric matrix model for comparing multiple teams against each other. Each cell represents the relationship or comparison between two teams, such as head-to-head results, relative strength, or matchup analysis.
  inherits: symmetric_matrix

  entities:
    - id: team_set
      prototype: set
      define_baseset: [primitive]
      define_prompt: The set of all teams under analysis.
      occur: 1
    - id: team
      prototype: dimension
      define_baseset: [team_set]
      define_prompt: Both row and column dimensions, each value is a team from team_set.
      occur: n+
    - id: cell_entity
      prototype: cell
      define_baseset: [team, team]
      define_prompt: Cell representing the symmetric relationship or comparison between two teams.
      occur: 1+

  relations:
    - id: matrix_comparison
      prototype: relation
      define_baseset: [team, team]
      define_prompt: Symmetric comparison relation between two teams in each cell (e.g., head-to-head record, matchup analysis).
      occur: 1