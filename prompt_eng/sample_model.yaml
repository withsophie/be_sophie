# ==========================================
#   Impossible Trinity (International Trade, G2_TrinaryTriangle Structure)
#
#                  capital_mobility
#                         ▲
#                        / \
#                       /   \
#                      /     \
#                     /       \
#                    /         \
#  exchange_rate_stability —— monetary_policy_independence
#
# Diagram:
# - Each vertex represents one of the three policy goals:
#     capital_mobility: Free capital mobility (no capital controls)
#     monetary_policy_independence: Independent monetary policy (control over domestic interest rates)
#     exchange_rate_stability: Stable/fixed exchange rate
# - Each edge represents the trade-off between two goals.
# - The trilemma: only two of the three can be achieved at the same time.
# ==========================================
model:
  id: impossible_triangle_trade
  name: Impossible Trinity (International Trade)
  ref_domain: international_trade
  visual: triangle
  description: >
    The Impossible Trinity (Trilemma) in international trade: a country cannot simultaneously achieve free capital mobility, independent monetary policy, and a fixed exchange rate. Only two of the three can be realized at the same time.
  inherits: trinary_triangle

  entities:
    - id: capital_mobility
      prototype: node
      define_baseset: [primitive]
      define_prompt: Free capital mobility (no capital controls)
      occur: 1
    - id: monetary_policy_independence
      prototype: node
      define_baseset: [primitive]
      define_prompt: Independent monetary policy (control over domestic interest rates)
      occur: 1
    - id: exchange_rate_stability
      prototype: node
      define_baseset: [primitive]
      define_prompt: Stable/fixed exchange rate
      occur: 1

  relations:
    - id: edge_capital_mobility_monetary_policy
      prototype: edge
      define_baseset: [capital_mobility, monetary_policy_independence]
      define_prompt: Trade-off between capital mobility and monetary policy independence
      occur: 1
    - id: edge_monetary_policy_exchange_rate
      prototype: edge
      define_baseset: [monetary_policy_independence, exchange_rate_stability]
      define_prompt: Trade-off between monetary policy independence and exchange rate stability
      occur: 1
    - id: edge_exchange_rate_capital_mobility
      prototype: edge
      define_baseset: [exchange_rate_stability, capital_mobility]
      define_prompt: Trade-off between exchange rate stability and capital mobility
      occur: 1

