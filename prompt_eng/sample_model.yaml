---
# ==========================================
#   SWOT Quadrant Model (Business, G1_BinaryOrthogonal Structure)
#
#            axis_advantage (Strength ↑ / Weakness ↓)
#                            ↑
#         S (Now+Strength)   |   O (Future+Strength)
#   ------------------------ + ------------------------→ axis_time (Now ← / → Future)
#         W (Now+Weakness)   |   T (Future+Weakness)
#                            ↓
#
# Explanation:
# - X axis (axis_time): Time (Now ←→ Future)
# - Y axis (axis_advantage): Advantage (Strength ↑, Weakness ↓)
# - Four quadrants:
#     S: Now + Strength (Current Strength)
#     W: Now + Weakness (Current Weakness)
#     O: Future + Strength (Future Opportunity)
#     T: Future + Weakness (Future Threat)
# ==========================================
model:
  id: swot
  name: SWOT Quadrant (Business, G1 Structure)
  ref_domain: business
  visual: quadrant
  description: >
    SWOT analysis in business, strictly following G1_BinaryOrthogonal structure.
    Axes: Time (Now/Future), Advantage (Strength/Weakness).
    S = Now+Strength, W = Now+Weakness, O = Future+Strength, T = Future+Weakness.
  inherits: binary_orthogonal

  entities:
    - id: axis_time
      prototype: axis
      define_prompt: Time axis (Now vs Future)
      occur: 1
    - id: axis_advantage
      prototype: axis
      define_prompt: Advantage axis (Strength vs Weakness)
      occur: 1
    - id: now
      prototype: vector
      define_baseset: [axis_time]
      define_prompt: Now
      occur: 1
    - id: future
      prototype: vector
      define_baseset: [axis_time]
      define_prompt: Future
      occur: 1
    - id: strength
      prototype: vector
      define_baseset: [axis_advantage]
      define_prompt: Strength
      occur: 1
    - id: weakness
      prototype: vector
      define_baseset: [axis_advantage]
      define_prompt: Weakness
      occur: 1
    - id: S
      prototype: quadrant
      define_baseset: [now, strength]
      define_prompt: S (Now + Strength)
      occur: 1
    - id: W
      prototype: quadrant
      define_baseset: [now, weakness]
      define_prompt: W (Now + Weakness)
      occur: 1
    - id: O
      prototype: quadrant
      define_baseset: [future, strength]
      define_prompt: O (Future + Strength)
      occur: 1
    - id: T
      prototype: quadrant
      define_baseset: [future, weakness]
      define_prompt: T (Future + Weakness)
      occur: 1

  relations:
    - id: time_flip
      prototype: symmetry
      define_baseset: [S, W, O, T]
      define_prompt: Flip Time (Now <-> Future)
      occur: 1+
    - id: advantage_flip
      prototype: symmetry
      define_baseset: [S, O, W, T]
      define_prompt: Flip Advantage (Strength <-> Weakness)
      occur: 1+
    - id: diagonal_reverse
      prototype: symmetry
      define_baseset: [S, T]
      define_prompt: Diagonal symmetry (S <-> T)
      occur: 1+
    - id: diagonal_swap
      prototype: symmetry
      define_baseset: [W, O]
      define_prompt: Diagonal symmetry (W <-> O)
      occur: 1+


---
# ==========================================
#   Religion Quadrant Model (G1_BinaryOrthogonal Structure)
#
#        axis_seek_who (Seek Others ↑ / Seek Self ↓)
#                                   ↑
#           this_world_other_help   |   afterlife_other_help
#          ------------------------ + ------------------------→ axis_destination (This World ← / → Afterlife)
#           this_world_self_help    |   afterlife_self_help
#                                   ↓
#
# Explanation:
# - X axis (axis_destination): Destination (This World ←→ Afterlife)
# - Y axis (axis_seek_who): Who is being sought (Seek Others ↑, Seek Self ↓)
# - Four quadrants (with examples):
#     this_world_other_help: Seek Others + This World (此岸他救)  
#         Example: Traditional Chinese folk religions where people pray to local deities for blessings in this life.
#     this_world_self_help: Seek Self + This World (此岸自救)  
#         Example: Confucianism, Stoicism (focus on self-cultivation and virtue in this life).
#     afterlife_other_help: Seek Others + Afterlife (彼岸他救)  
#         Example: Christianity (salvation by God), Pure Land Buddhism (salvation by Amitabha Buddha).
#     afterlife_self_help: Seek Self + Afterlife (彼岸自救)  
#         Example: Buddhism (Theravada, Zen—enlightenment through self-practice).
# ==========================================
model:
  id: religion_quadrant
  name: Religion Quadrant (G1 Structure)
  ref_domain: religion
  visual: quadrant
  description: >
    A quadrant model for religion based on two axes: Who is being sought (Seek Others/Seek Self) and Destination (This World/Afterlife). Each quadrant represents a combination of religious orientation and goal.
  inherits: binary_orthogonal

  entities:
    - id: axis_seek_who
      prototype: axis
      define_prompt: Who is being sought axis (Seek Others vs Seek Self)
      occur: 1
    - id: axis_destination
      prototype: axis
      define_prompt: Destination axis (This World vs Afterlife)
      occur: 1
    - id: seek_others
      prototype: vector
      define_baseset: [axis_seek_who]
      define_prompt: Seek Others (e.g., deities, external forces)
      occur: 1
    - id: seek_self
      prototype: vector
      define_baseset: [axis_seek_who]
      define_prompt: Seek Self (e.g., self-cultivation, inner power)
      occur: 1
    - id: this_world
      prototype: vector
      define_baseset: [axis_destination]
      define_prompt: This World (focus on present life)
      occur: 1
    - id: afterlife
      prototype: vector
      define_baseset: [axis_destination]
      define_prompt: Afterlife (focus on salvation or liberation after death)
      occur: 1
    - id: this_world_self_help
      prototype: quadrant
      define_baseset: [seek_self, this_world]
      define_prompt: This World Self-Help (此岸自救)
      occur: 1
    - id: this_world_other_help
      prototype: quadrant
      define_baseset: [seek_others, this_world]
      define_prompt: This World Other-Help (此岸他救)
      occur: 1
    - id: afterlife_self_help
      prototype: quadrant
      define_baseset: [seek_self, afterlife]
      define_prompt: Afterlife Self-Help (彼岸自救)
      occur: 1
    - id: afterlife_other_help
      prototype: quadrant
      define_baseset: [seek_others, afterlife]
      define_prompt: Afterlife Other-Help (彼岸他救)
      occur: 1

  relations:
    - id: seek_who_flip
      prototype: symmetry
      define_baseset: [this_world_self_help, this_world_other_help, afterlife_self_help, afterlife_other_help]
      define_prompt: Flip Who is being sought (Seek Others <-> Seek Self)
      occur: 1+
    - id: destination_flip
      prototype: symmetry
      define_baseset: [this_world_self_help, afterlife_self_help, this_world_other_help, afterlife_other_help]
      define_prompt: Flip Destination (This World <-> Afterlife)
      occur: 1+
    - id: diagonal_reverse
      prototype: symmetry
      define_baseset: [this_world_other_help, afterlife_self_help]
      define_prompt: Diagonal symmetry (This World Other-Help <-> Afterlife Self-Help)
      occur: 1+
    - id: diagonal_swap
      prototype: symmetry
      define_baseset: [this_world_self_help, afterlife_other_help]
      define_prompt: Diagonal symmetry (This World Self-Help <-> Afterlife Other-Help)
      occur: 1+


