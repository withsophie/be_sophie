# -------------G7-------------------------------------
entity:
  - id: policy_topic_set:symmetric_matrix
    prototype: set
    define_baseset: [primitive]
    define_prompt: 美国民主党主要政策议题集合（如医疗、教育、环境、经济、移民等）。
    occur: 1
    inherits: base_entity
  - id: policy_topic:symmetric_matrix
    prototype: dimension
    define_baseset: [policy_topic_set:symmetric_matrix]
    define_prompt: 民主党政策议题的维度，每个值代表一个具体政策议题。
    occur: n+
    inherits: base_entity
  - id: policy_relation_cell:symmetric_matrix
    prototype: cell
    define_baseset: [policy_topic:symmetric_matrix, policy_topic:symmetric_matrix]
    define_prompt: 由两个政策议题交叉定义的单元格，表示这两个议题之间的对比或协同关系。
    occur: 1+
    inherits: base_entity

relation:
  - id: matrix_comparison:symmetric_matrix
    prototype: relation
    define_baseset: [policy_topic:symmetric_matrix, policy_topic:symmetric_matrix]
    define_prompt: 在对称矩阵中，不同政策议题之间的对比、协同或冲突关系分析。
    occur: 1
    inherits: base_relation

# -------------G6-------------------------------------
entity:
  - id: policy_area_set:hybrid_matrix
    prototype: set
    define_baseset: [primitive]
    define_prompt: 民主党政策涉及的主要领域集合（如经济、医疗、教育、环境、外交等）。
    occur: 1
    inherits: base_entity
  - id: policy_time_set:hybrid_matrix
    prototype: set
    define_baseset: [primitive]
    define_prompt: 民主党政策制定或实施的时间阶段集合（如2000年代、2010年代、2020年代等）。
    occur: 1
    inherits: base_entity
  - id: policy_area:hybrid_matrix
    prototype: dimension
    define_baseset: [policy_area_set:hybrid_matrix]
    define_prompt: 民主党政策的具体领域维度，每个值代表一个政策领域。
    occur: n+
    inherits: base_entity
  - id: policy_time:hybrid_matrix
    prototype: dimension
    define_baseset: [policy_time_set:hybrid_matrix]
    define_prompt: 民主党政策的具体时间阶段维度，每个值代表一个时间段。
    occur: n+
    inherits: base_entity
  - id: policy_cell:hybrid_matrix
    prototype: cell
    define_baseset: [policy_area:hybrid_matrix, policy_time:hybrid_matrix]
    define_prompt: 由特定政策领域和时间阶段交叉定义的单元格，代表该领域在该时间段的政策内容。
    occur: n+
    inherits: base_entity

relation:
  - id: matrix_cross:hybrid_matrix
    prototype: relation
    define_baseset: [policy_area:hybrid_matrix, policy_time:hybrid_matrix]
    define_prompt: 在矩阵中，政策领域与时间阶段的交叉关系，揭示各领域在不同时间段的政策表现。
    occur: 1
    inherits: base_relation

    # -------------G5-------------------------------------
        entity:
      - id: origin:central_expansion
        prototype: point
        define_baseset: [primitive]
        define_prompt: 美国民主党政策的核心价值观（如平等、包容、社会正义等）的中心点。
        occur: 1
        inherits: base_entity
      - id: radius:central_expansion
        prototype: segment
        define_baseset: [origin:central_expansion]
        define_prompt: 从核心价值观向外扩展的政策路径，代表政策从核心理念向具体领域的延展。
        occur: 1
        inherits: base_relation
      - id: boundary:central_expansion
        prototype: circle
        define_baseset: [origin:central_expansion, radius:central_expansion]
        define_prompt: 民主党政策的边界，体现其政策影响力和包容范围的最大外延。
        occur: 1
        inherits: base_entity
      - id: interior:central_expansion
        prototype: region
        define_baseset: [boundary:central_expansion]
        define_prompt: 边界之内的政策领域，代表民主党主流和核心政策覆盖的范围。
        occur: 1
        inherits: base_entity
      - id: exterior:central_expansion
        prototype: region
        define_baseset: [boundary:central_expansion]
        define_prompt: 边界之外的领域，代表民主党政策尚未覆盖或不涉足的议题空间。
        occur: 1
        inherits: base_entity
    
    relation:
      - id: expansion:central_expansion
        prototype: function
        define_baseset: [origin:central_expansion, boundary:central_expansion]
        define_prompt: 从核心价值观向政策边界的扩展过程，体现政策影响力的外延扩张。
        occur: 1
        inherits: base_relation
      - id: contraction:central_expansion
        prototype: function
        define_baseset: [boundary:central_expansion, origin:central_expansion]
        define_prompt: 从政策边界向核心价值观的收缩过程，体现政策聚焦和回归核心的动态。
        occur: 1
        inherits: base_relation
# -------------G4-------------------------------------
entity:
  - id: core_policies:closure
    prototype: set
    define_baseset: [primitive]
    define_prompt: 美国民主党的核心政策集合（如社会平权、医疗改革、环保等）。
    occur: 1+
    inherits: base_entity
  - id: extended_policies:closure
    prototype: set
    define_baseset: [primitive]
    define_prompt: 美国民主党在特定时期或特定议题下扩展的政策集合（如贸易、外交、科技等）。
    occur: 1+
    inherits: base_entity

relation:
  - id: intersection:closure
    prototype: set_operation
    define_baseset: [core_policies:closure, extended_policies:closure]
    define_prompt: 核心政策与扩展政策的交集，代表两者共同关注的政策领域。
    occur: 1*
    inherits: base_relation
  - id: union:closure
    prototype: set_operation
    define_baseset: [core_policies:closure, extended_policies:closure]
    define_prompt: 核心政策与扩展政策的并集，代表美国民主党整体政策覆盖范围。
    occur: 1*
    inherits: base_relation
  - id: difference:closure
    prototype: set_operation
    define_baseset: [core_policies:closure, extended_policies:closure]
    define_prompt: 核心政策中不包含于扩展政策的部分，代表民主党独有的核心立场。
    occur: 1*
    inherits: base_relation
  - id: difference_reverse:closure
    prototype: set_operation
    define_baseset: [extended_policies:closure, core_policies:closure]
    define_prompt: 扩展政策中不包含于核心政策的部分，代表民主党根据外部环境调整的新政策。
    occur: 1*
    inherits: base_relation
# -------------G3-------------------------------------
entity:
  - id: progressive_policy:negative_feedback_opposition
    prototype: point
    define_baseset: [primitive]
    define_prompt: 代表美国民主党倾向的进步政策（如社会平权、环保、医疗改革等）。
    occur: 1
    inherits: base_entity
  - id: moderate_policy:negative_feedback_opposition
    prototype: point
    define_baseset: [primitive]
    define_prompt: 代表美国民主党内的温和政策（如财政平衡、渐进改革、妥协性措施等）。
    occur: 1
    inherits: base_entity
  - id: policy_change_path:negative_feedback_opposition
    prototype: segment
    define_baseset: [progressive_policy:negative_feedback_opposition, moderate_policy:negative_feedback_opposition]
    define_prompt: 进步政策与温和政策之间的政策调整路径。
    occur: 1
    inherits: base_relation
  - id: policy_equilibrium:negative_feedback_opposition
    prototype: point
    define_baseset: [progressive_policy:negative_feedback_opposition, moderate_policy:negative_feedback_opposition, policy_change_path:negative_feedback_opposition]
    define_prompt: 民主党政策在进步与温和之间的动态平衡点。
    occur: 1
    inherits: base_entity

relation:
  - id: activation_progressive_to_moderate:negative_feedback_opposition
    prototype: function
    define_baseset: [progressive_policy:negative_feedback_opposition]
    define_prompt: 进步政策对温和政策的激活或影响（如推动温和政策向进步方向调整）。
    occur: 1
    inherits: base_relation
  - id: activation_moderate_to_progressive:negative_feedback_opposition
    prototype: function
    define_baseset: [moderate_policy:negative_feedback_opposition]
    define_prompt: 温和政策对进步政策的激活或影响（如推动进步政策向温和方向调整）。
    occur: 1
    inherits: base_relation
  - id: negative_feedback_progressive_to_moderate:negative_feedback_opposition
    prototype: function
    define_baseset: [progressive_policy:negative_feedback_opposition]
    define_prompt: 当进步政策过度时的负反馈，促使政策向温和方向回调。
    occur: 1
    inherits: base_relation
  - id: negative_feedback_moderate_to_progressive:negative_feedback_opposition
    prototype: function
    define_baseset: [moderate_policy:negative_feedback_opposition]
    define_prompt: 当温和政策过度时的负反馈，促使政策向进步方向回调。
    occur: 1
    inherits: base_relation

