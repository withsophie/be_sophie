---
model:
  id: ModelInstance
  name: 美国民主党政策三元分析
  ref_domain: policy      # 涉及领域为政策分析
  visual: triangle
  description: 使用三元三角模型分析美国民主党的三大核心政策取向及其相互关系。
  inherits: trinary_triangle
  entities:
    - id: social_policy:trinary_triangle
      prototype: node
      define_baseset: [primitive]
      define_prompt: 社会政策节点，代表美国民主党在社会公平、福利、教育等方面的政策主张。
      occur: 1
      inherits: node_a:trinary_triangle
    - id: economic_policy:trinary_triangle
      prototype: node
      define_baseset: [primitive]
      define_prompt: 经济政策节点，代表美国民主党在税收、就业、经济增长等方面的政策主张。
      occur: 1
      inherits: node_b:trinary_triangle
    - id: environmental_policy:trinary_triangle
      prototype: node
      define_baseset: [primitive]
      define_prompt: 环境政策节点，代表美国民主党在气候变化、可持续发展等方面的政策主张。
      occur: 1
      inherits: node_c:trinary_triangle
  relations:
    - id: social_economic_link:trinary_triangle
      prototype: edge
      define_baseset: [social_policy:trinary_triangle, economic_policy:trinary_triangle]
      define_prompt: 社会政策与经济政策之间的相互影响与协调关系。
      occur: 1
      inherits: edge_ab:trinary_triangle
    - id: economic_environmental_link:trinary_triangle
      prototype: edge
      define_baseset: [economic_policy:trinary_triangle, environmental_policy:trinary_triangle]
      define_prompt: 经济政策与环境政策之间的平衡与冲突关系。
      occur: 1
      inherits: edge_bc:trinary_triangle
    - id: environmental_social_link:trinary_triangle
      prototype: edge
      define_baseset: [environmental_policy:trinary_triangle, social_policy:trinary_triangle]
      define_prompt: 环境政策与社会政策之间的协同与制约关系。
      occur: 1
      inherits: edge_ca:trinary_triangle

# -------------G1-------------------------------------
---
model:
  id: ModelInstance
  name: 美国民主党政策二元正交分析
  ref_domain: geometry
  visual: quadrant
  description: 使用二元正交象限模型分析美国民主党的两大政策主轴及其组合象限。
  inherits: binary_orthogonal
  entities:
    - id: axis_x:ModelInstance
      prototype: axis
      define_baseset: [primitive]
      define_prompt: 经济政策主轴，代表美国民主党在经济领域的政策取向（如税收、就业、福利等）。
      occur: 1
      inherits: axis_x:binary_orthogonal
    - id: axis_y:ModelInstance
      prototype: axis
      define_baseset: [primitive]
      define_prompt: 社会政策主轴，代表美国民主党在社会领域的政策取向（如平权、教育、医疗等）。
      occur: 1
      inherits: axis_y:binary_orthogonal
    - id: x_positive:ModelInstance
      prototype: vector
      define_baseset: [axis_x:ModelInstance]
      define_prompt: 经济政策积极方向（如扩大公共投资、提高最低工资）。
      occur: 1
      inherits: x_positive:binary_orthogonal
    - id: x_negative:ModelInstance
      prototype: vector
      define_baseset: [axis_x:ModelInstance]
      define_prompt: 经济政策保守方向（如减税、市场自由化）。
      occur: 1
      inherits: x_negative:binary_orthogonal
    - id: y_positive:ModelInstance
      prototype: vector
      define_baseset: [axis_y:ModelInstance]
      define_prompt: 社会政策进步方向（如推动平权、扩大医保覆盖）。
      occur: 1
      inherits: y_positive:binary_orthogonal
    - id: y_negative:ModelInstance
      prototype: vector
      define_baseset: [axis_y:ModelInstance]
      define_prompt: 社会政策保守方向（如限制移民、传统价值观）。
      occur: 1
      inherits: y_negative:binary_orthogonal
    - id: quadrant_I:ModelInstance
      prototype: quadrant
      define_baseset: [x_positive:ModelInstance, y_positive:ModelInstance]
      define_prompt: 经济进步+社会进步（美国民主党主流政策组合）。
      occur: 1
      inherits: quadrant_I:binary_orthogonal
    - id: quadrant_II:ModelInstance
      prototype: quadrant
      define_baseset: [x_negative:ModelInstance, y_positive:ModelInstance]
      define_prompt: 经济保守+社会进步（如财政保守但社会开放派）。
      occur: 1
      inherits: quadrant_II:binary_orthogonal
    - id: quadrant_III:ModelInstance
      prototype: quadrant
      define_baseset: [x_negative:ModelInstance, y_negative:ModelInstance]
      define_prompt: 经济保守+社会保守（与民主党主流立场相对）。
      occur: 1
      inherits: quadrant_III:binary_orthogonal
    - id: quadrant_IV:ModelInstance
      prototype: quadrant
      define_baseset: [x_positive:ModelInstance, y_negative:ModelInstance]
      define_prompt: 经济进步+社会保守（如经济左翼但社会保守派）。
      occur: 1
      inherits: quadrant_IV:binary_orthogonal
  relations:
    - id: x_flip:ModelInstance
      prototype: symmetry
      define_baseset: [axis_x:ModelInstance]
      define_prompt: 沿经济政策主轴的对称变换（如经济立场正负切换）。
      occur: 1
      inherits: x_flip:binary_orthogonal
    - id: y_flip:ModelInstance
      prototype: symmetry
      define_baseset: [axis_y:ModelInstance]
      define_prompt: 沿社会政策主轴的对称变换（如社会立场正负切换）。
      occur: 1
      inherits: y_flip:binary_orthogonal
    - id: diagonal_reverse:ModelInstance
      prototype: symmetry
      define_baseset: [x_flip:ModelInstance, y_flip:ModelInstance]
      define_prompt: 对角线反转（经济与社会立场同时切换）。
      occur: 1
      inherits: diagonal_reverse:binary_orthogonal
    - id: diagonal_swap:ModelInstance
      prototype: symmetry
      define_baseset: [x_flip:ModelInstance, y_flip:ModelInstance]
      define_prompt: 对角线交换（交叉切换经济与社会立场）。
      occur: 1
      inherits: diagonal_swap:binary_orthogonal